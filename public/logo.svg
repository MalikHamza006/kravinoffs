<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="goldBeam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8C77C" />
      <stop offset="60%" stop-color="#D9A441" />
      <stop offset="100%" stop-color="#9E731C" />
    </linearGradient>
    <linearGradient id="glowEffect" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8C77C" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#D9A441" stop-opacity="0" />
    </linearGradient>
  </defs>
  
  <!-- Outer Dark Obsidian Container with Subtle Border -->
  <rect width="100" height="100" rx="22" fill="#0E0E0E" stroke="#292929" stroke-width="2" />
  
  <!-- Subtle Internal Gold Ambient Glow -->
  <circle cx="50" cy="50" r="30" fill="#D9A441" opacity="0.12" filter="blur(8px)" />

  <!-- Iconic Monogram "L" + Lightyear Beam Geometry -->
  <!-- Vertical Beam with Champagne to Gold Gradient -->
  <path d="M30 22 H42 V62 H74 V74 H30 Z" fill="url(#goldBeam)" />
  
  <!-- Dynamic Lightyear Angular Facet (Ascending Ray) -->
  <path d="M42 22 L72 52 H58 L38 32 Z" fill="#E8C77C" opacity="0.65" />
  
  <!-- Precision Corner Star/Dot Accent -->
  <circle cx="74" cy="26" r="3" fill="#E8C77C" />
  <circle cx="74" cy="26" r="5" stroke="#D9A441" stroke-width="1" opacity="0.6" />
</svg>
